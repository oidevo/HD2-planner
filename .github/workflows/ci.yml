name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify Tk-enabled GUI imports
        run: python -c "import tkinter, hd2lib.gui; print(tkinter.TkVersion)"
      - name: Run tests
        run: python -m unittest discover -s tests -v
